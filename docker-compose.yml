services:
  postgres:
    image: postgres:16-alpine
    container_name: ipl-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ipl-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.0
    container_name: ipl-airflow-init

    depends_on:
      - postgres

    env_file:
      - .env

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname IPL
      --lastname Admin
      --role Admin
      --email admin@ipl.local
      "

  airflow-webserver:
    image: apache/airflow:2.10.0
    container_name: ipl-airflow-webserver

    depends_on:
      - airflow-init

    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command: webserver

    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.0
    container_name: ipl-airflow-scheduler

    depends_on:
      - airflow-init

    env_file:
      - .env

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command: scheduler

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: