version: 2

models:

  - name: stg_players
    columns:
      - name: player_sk
        tests:
          - not_null

  - name: mart_player_career
    columns:
      - name: player_sk
        tests:
          - unique
          - not_null

  - name: mart_player_seasons
    columns:
      - name: player_sk
        tests:
          - not_null

      - name: season_year
        tests:
          - not_null

  - name: mart_team_seasons
    columns:
      - name: season_year
        tests:
          - unique
          - not_null

  - name: mart_venue_analysis
    columns:
      - name: venue_name
        tests:
          - not_null

  - name: mart_scouting
    columns:
      - name: player_name
        tests:
          - not_null